<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice">
<style>
.au{animation:au 9s ease-in-out infinite alternate;transform-origin:150px 120px}
.au2{animation:au 13s ease-in-out infinite alternate-reverse;transform-origin:150px 100px}
@keyframes au{0%{transform:translateX(-10px) scaleY(.9);opacity:.75}100%{transform:translateX(12px) scaleY(1.1);opacity:1}}
.tw{animation:tw 3s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.25}}
.blink{animation:bl 1.6s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.snow{animation:sn 7s linear infinite}
@keyframes sn{from{transform:translate(0,-60px)}to{transform:translate(-30px,400px)}}
</style>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050a1e"/><stop offset=".55" stop-color="#0f2a4a"/><stop offset="1" stop-color="#2d5c78"/></linearGradient>
<linearGradient id="aur" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7affc8" stop-opacity="0"/><stop offset=".55" stop-color="#5dffb0" stop-opacity=".75"/><stop offset="1" stop-color="#29c7a6" stop-opacity="0"/></linearGradient>
<linearGradient id="aur2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b48cff" stop-opacity="0"/><stop offset=".6" stop-color="#8f7bff" stop-opacity=".55"/><stop offset="1" stop-color="#4fb4ff" stop-opacity="0"/></linearGradient>
<linearGradient id="fog" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fd4e8" stop-opacity="0"/><stop offset="1" stop-color="#9fd4e8" stop-opacity=".35"/></linearGradient>
<linearGradient id="snowg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dbeaf3"/><stop offset="1" stop-color="#9bb8cc"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#ffb35c" stop-opacity=".9"/><stop offset="1" stop-color="#ffb35c" stop-opacity="0"/></radialGradient>
<filter id="bl" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="300" height="400" fill="url(#sky)"/>
<g fill="#fff">
<circle class="tw" cx="24" cy="30" r="1"/><circle cx="62" cy="58" r=".8"/><circle class="tw" cx="110" cy="22" r="1.1"/><circle cx="168" cy="44" r=".7"/><circle class="tw" cx="214" cy="18" r="1"/><circle cx="262" cy="52" r=".9"/><circle cx="286" cy="24" r=".7"/><circle class="tw" cx="140" cy="70" r=".8"/><circle cx="38" cy="96" r=".6"/><circle cx="244" cy="92" r=".7"/><circle class="tw" cx="88" cy="128" r=".6"/>
</g>
<g filter="url(#bl)">
<path class="au" d="M-20 150 C40 70 90 160 150 90 S250 40 330 110 L330 160 C250 100 210 170 150 140 S40 130 -20 200Z" fill="url(#aur)"/>
<path class="au2" d="M-20 100 C60 40 120 120 180 60 S280 30 330 70 L330 110 C270 70 220 120 170 100 S60 90 -20 150Z" fill="url(#aur2)"/>
</g>
<path d="M0 250 L40 200 L70 222 L118 170 L160 214 L200 182 L246 226 L300 196 L300 400 L0 400Z" fill="#33607e"/>
<path d="M118 170 L104 186 L114 184 L120 192 L128 182 Z M200 182 L190 194 L202 192 L210 196Z" fill="#b8d6e6" opacity=".7"/>
<rect y="200" width="300" height="90" fill="url(#fog)"/>
<path d="M0 290 L30 262 L66 280 L104 246 L150 276 L190 254 L236 282 L270 262 L300 276 L300 400 L0 400Z" fill="#244a66"/>
<rect y="260" width="300" height="70" fill="url(#fog)"/>
<path d="M0 330 C60 300 110 318 160 306 S260 296 300 312 L300 400 L0 400Z" fill="url(#snowg)"/>
<!-- station -->
<g>
<circle cx="150" cy="300" r="60" fill="url(#glow)" opacity=".35"/>
<rect x="104" y="284" width="70" height="28" rx="3" fill="#2a3d52"/>
<rect x="104" y="281" width="70" height="5" rx="2" fill="#e8f2f8"/>
<rect x="172" y="292" width="34" height="20" rx="3" fill="#22344a"/>
<rect x="172" y="289" width="34" height="4" rx="2" fill="#e8f2f8"/>
<rect x="114" y="292" width="10" height="7" fill="#ffc172"/><rect x="130" y="292" width="10" height="7" fill="#ffc172"/><rect x="146" y="292" width="10" height="7" fill="#ffd9a0"/><rect x="180" y="298" width="8" height="6" fill="#ffc172"/>
<rect x="160" y="300" width="9" height="12" fill="#ff9d3c" opacity=".9"/>
<line x1="94" y1="312" x2="94" y2="230" stroke="#1a2a3a" stroke-width="2.4"/>
<line x1="94" y1="240" x2="80" y2="312" stroke="#1a2a3a" stroke-width="1"/><line x1="94" y1="240" x2="108" y2="312" stroke="#1a2a3a" stroke-width="1"/>
<path d="M86 246 l16 0 M84 262 l20 0 M82 278 l24 0" stroke="#1a2a3a" stroke-width="1"/>
<circle class="blink" cx="94" cy="228" r="2.6" fill="#ff4a4a"/>
<circle class="blink" cx="94" cy="228" r="8" fill="#ff4a4a" opacity=".25"/>
<path d="M174 312 q20 14 50 16" stroke="#7c95a8" stroke-width="1.2" fill="none" stroke-dasharray="2 3"/>
</g>
<path d="M0 352 C70 334 140 352 200 340 S280 336 300 344 L300 400 L0 400Z" fill="#eef5fa"/>
<g fill="#fff" opacity=".85">
<circle class="snow" cx="30" cy="0" r="1.4" style="animation-delay:-1s"/><circle class="snow" cx="80" cy="0" r="1" style="animation-delay:-3s"/><circle class="snow" cx="130" cy="0" r="1.6" style="animation-delay:-5s"/><circle class="snow" cx="190" cy="0" r="1.1" style="animation-delay:-2s"/><circle class="snow" cx="240" cy="0" r="1.5" style="animation-delay:-6s"/><circle class="snow" cx="290" cy="0" r="1" style="animation-delay:-4s"/><circle class="snow" cx="320" cy="0" r="1.3" style="animation-delay:-.5s"/><circle class="snow" cx="160" cy="0" r=".9" style="animation-delay:-2.5s"/>
</g>
</svg>
