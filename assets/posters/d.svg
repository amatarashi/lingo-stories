<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice">
<style>
.flash{animation:fl 3.2s ease-out infinite;opacity:0}
.f2{animation-delay:1.1s}.f3{animation-delay:2.2s}
@keyframes fl{0%{opacity:0}3%{opacity:1}12%{opacity:0}100%{opacity:0}}
.neon{animation:nn 4s ease-in-out infinite alternate}
@keyframes nn{0%,100%{opacity:1}48%{opacity:1}50%{opacity:.55}52%{opacity:1}}
.spot{animation:sp 7s ease-in-out infinite alternate;transform-origin:150px -20px}
@keyframes sp{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
.note{animation:nt 6s ease-in-out infinite}
@keyframes nt{0%{transform:translate(0,0);opacity:0}20%{opacity:1}100%{transform:translate(-26px,-120px);opacity:0}}
.n2{animation-delay:2s}.n3{animation-delay:4s}
.tw{animation:tw 2.4s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.2}}
</style>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#120f26"/><stop offset=".55" stop-color="#3a2050"/><stop offset="1" stop-color="#7a3a6a"/></linearGradient>
<linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe6f4" stop-opacity=".55"/><stop offset="1" stop-color="#ff8fc8" stop-opacity="0"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".3" stop-color="#fff" stop-opacity=".4"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<radialGradient id="pink" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff8fc8" stop-opacity=".7"/><stop offset="1" stop-color="#ff8fc8" stop-opacity="0"/></radialGradient>
<linearGradient id="street" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1a34"/><stop offset="1" stop-color="#0e0a16"/></linearGradient>
</defs>
<rect width="300" height="400" fill="url(#sky)"/>
<g fill="#fff"><circle class="tw" cx="40" cy="40" r="1.2"/><circle class="tw" cx="120" cy="22" r="1"/><circle class="tw" cx="250" cy="55" r="1.3"/><circle class="tw" cx="200" cy="30" r=".9"/><circle class="tw" cx="80" cy="80" r="1"/></g>
<!-- skyline: Big Ben, the Shard, rooftops -->
<g fill="#1c1430">
<path d="M0 250 V200 h20 v-15 h18 v15 h22 v-30 h14 v30 h20 V250z"/>
<path d="M92 250 V150 h6 v-14 l6 -16 l6 16 v14 h6 V250z"/>
<rect x="100" y="160" width="12" height="12" fill="#ffd98a" opacity=".8"/>
<path d="M126 250 V196 h30 v-12 h24 v66z"/>
<path d="M188 250 L222 92 L246 250z"/>
<path d="M246 250 V190 h22 v-10 h12 v10 h20 V250z"/>
</g>
<g fill="#ffd27a" opacity=".75"><rect x="10" y="210" width="4" height="5"/><rect x="48" y="196" width="4" height="5"/><rect x="134" y="206" width="4" height="5"/><rect x="164" y="214" width="4" height="5"/><rect x="214" y="160" width="3" height="5"/><rect x="226" y="200" width="3" height="5"/><rect x="256" y="204" width="4" height="5"/><rect x="282" y="214" width="4" height="5"/></g>
<!-- spotlight -->
<path class="spot" d="M150 -20 L80 320 L220 320z" fill="url(#beam)"/>
<!-- street and stage door -->
<rect y="250" width="300" height="150" fill="url(#street)"/>
<g opacity=".35"><rect x="60" y="300" width="4" height="60" fill="#ff8fc8"/><rect x="200" y="310" width="4" height="50" fill="#7ad8ff"/><rect x="140" y="320" width="3" height="40" fill="#ffd27a"/></g>
<!-- neon sign -->
<ellipse cx="150" cy="292" rx="110" ry="40" fill="url(#pink)"/>
<g class="neon" font-family="Georgia,serif" font-style="italic" font-weight="bold" text-anchor="middle">
<text x="150" y="300" font-size="44" fill="#ffd0ea" stroke="#ff4aa8" stroke-width="1.2">Backstage</text>
</g>
<!-- microphone -->
<g transform="translate(150 360)">
<rect x="-2" y="-30" width="4" height="40" fill="#c9a24a"/>
<rect x="-7" y="-52" width="14" height="24" rx="7" fill="#d8d8e0" stroke="#8a8a96"/>
<path d="M-7 -44h14M-7 -38h14" stroke="#8a8a96"/>
<rect x="-14" y="8" width="28" height="4" rx="2" fill="#c9a24a"/>
</g>
<!-- music notes -->
<g fill="#ff8fc8" font-size="20" font-family="sans-serif"><text class="note" x="168" y="330">♪</text><text class="note n2" x="130" y="336">♫</text><text class="note n3" x="185" y="340">♪</text></g>
<!-- paparazzi flashes -->
<circle class="flash" cx="34" cy="352" r="40" fill="url(#glow)"/>
<circle class="flash f2" cx="268" cy="340" r="44" fill="url(#glow)"/>
<circle class="flash f3" cx="90" cy="378" r="34" fill="url(#glow)"/>
</svg>
