<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice">
<style>
.gull{animation:gu 14s linear infinite}
@keyframes gu{from{transform:translateX(-60px)}to{transform:translateX(360px)}}
.flap{animation:fl .6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes fl{to{transform:scaleY(.4)}}
.beam{animation:bm 6s ease-in-out infinite alternate;transform-origin:214px 196px}
@keyframes bm{from{transform:rotate(-14deg);opacity:.25}to{transform:rotate(12deg);opacity:.55}}
.wave{animation:wv 6s ease-in-out infinite alternate}
@keyframes wv{to{transform:translateX(-14px)}}
.leaf{animation:lf 9s linear infinite}
@keyframes lf{from{transform:translate(0,-20px) rotate(0)}to{transform:translate(-120px,420px) rotate(540deg)}}
</style>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b4f7a"/><stop offset=".35" stop-color="#d9826a"/><stop offset=".62" stop-color="#ffc27a"/><stop offset="1" stop-color="#ffe2b0"/></linearGradient>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a9bb0"/><stop offset="1" stop-color="#4c5f7a"/></linearGradient>
<linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3d0"/><stop offset="1" stop-color="#ffd08a"/></linearGradient>
<linearGradient id="beamg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff6d8" stop-opacity=".9"/><stop offset="1" stop-color="#fff6d8" stop-opacity="0"/></linearGradient>
<radialGradient id="sunglow"><stop offset="0" stop-color="#fff0c0" stop-opacity=".8"/><stop offset="1" stop-color="#ffb070" stop-opacity="0"/></radialGradient>
</defs>
<rect width="300" height="400" fill="url(#sky)"/>
<circle cx="96" cy="218" r="90" fill="url(#sunglow)"/>
<circle cx="96" cy="218" r="26" fill="url(#sun)"/>
<g fill="#fff" opacity=".35"><ellipse cx="200" cy="90" rx="50" ry="6"/><ellipse cx="230" cy="100" rx="34" ry="4"/><ellipse cx="60" cy="130" rx="40" ry="4"/></g>
<!-- sea -->
<rect y="222" width="300" height="80" fill="url(#sea)"/>
<rect x="66" y="222" width="60" height="70" fill="#ffd9a0" opacity=".35"/>
<g class="wave" stroke="#ffe7c0" stroke-width="1" opacity=".55"><path d="M70 232 h22 M100 240 h30 M60 250 h20 M90 258 h40 M76 270 h24 M20 244 h18 M180 236 h26 M220 252 h30 M160 266 h22 M300 246 h-20"/></g>
<!-- far cliffs -->
<path d="M150 230 C170 214 186 204 210 204 L232 204 C252 200 276 204 300 196 V300 H150Z" fill="#6b6a7c"/>
<!-- lighthouse -->
<path class="beam" d="M214 196 L330 176 L330 216Z" fill="url(#beamg)"/>
<path d="M207 204 L210 168 h8 l3 36z" fill="#f4ede2"/>
<path d="M208.4 192 h11 l.6 6 h-12.2z M209.4 180 h9 l.5 6 h-10z" fill="#c4473a"/>
<rect x="208" y="160" width="12" height="9" fill="#2e2a33"/><rect x="209.5" y="161.5" width="9" height="6" fill="#fff2b8"/>
<path d="M206 160 l8 -6 l8 6z" fill="#c4473a"/>
<!-- hill town -->
<path d="M0 300 V246 C30 236 60 240 90 250 C120 258 150 254 180 262 C220 272 260 268 300 276 V300Z" fill="#7a8a52"/>
<g>
<rect x="18" y="226" width="22" height="22" fill="#e8d5b5"/><path d="M15 228 l14 -12 l14 12z" fill="#8a4a3a"/><rect x="24" y="232" width="5" height="6" fill="#ffd27a"/>
<rect x="42" y="230" width="18" height="20" fill="#9fb8c8"/><path d="M40 232 l11 -10 l11 10z" fill="#5a4a52"/><rect x="47" y="236" width="5" height="6" fill="#ffd27a"/>
<rect x="62" y="234" width="24" height="18" fill="#f0c4a0"/><path d="M60 236 l14 -10 l14 10z" fill="#8a4a3a"/><rect x="70" y="240" width="5" height="5" fill="#ffd27a"/>
<rect x="88" y="238" width="18" height="18" fill="#e8e0c8"/><path d="M86 240 l11 -9 l11 9z" fill="#4a5a6a"/>
<rect x="108" y="242" width="22" height="18" fill="#c8a0b0"/><path d="M106 244 l13 -9 l13 9z" fill="#5a4a52"/><rect x="115" y="248" width="5" height="5" fill="#ffd27a"/>
</g>
<!-- autumn trees and near hill -->
<g fill="#d8742c"><circle cx="140" cy="256" r="12"/><circle cx="154" cy="262" r="9" fill="#e8a040"/><circle cx="6" cy="242" r="10" fill="#c9562a"/></g>
<path d="M0 400 V300 C40 286 90 292 140 304 C190 316 240 300 300 310 V400Z" fill="#4e5f36"/>
<path d="M0 400 V330 C60 318 120 330 170 338 C220 346 260 334 300 340 V400Z" fill="#37462a"/>
<!-- road and bench with a figure -->
<path d="M120 400 C150 360 170 340 210 330 L222 332 C190 344 176 366 160 400Z" fill="#b89a74" opacity=".8"/>
<g fill="#1e1a18"><rect x="40" y="336" width="54" height="4" rx="1"/><rect x="40" y="328" width="54" height="3" rx="1"/><rect x="44" y="340" width="3" height="10"/><rect x="87" y="340" width="3" height="10"/>
<circle cx="70" cy="306" r="6.5"/><path d="M61 336 q0 -24 9 -24 q9 0 9 24z"/><path d="M60 322 l-5 14 h4z"/><rect x="72" y="324" width="10" height="7" rx="1.5" fill="#a64a32"/></g>
<path d="M63 304 q7 -10 14 0 q-2 -6 -7 -6 q-5 0 -7 6z" fill="#3a2a22"/>
<!-- gulls -->
<g class="gull" fill="none" stroke="#3a3540" stroke-width="1.6" stroke-linecap="round">
<path class="flap" d="M40 120 q6 -6 12 0 q6 -6 12 0"/>
<path class="flap" d="M10 140 q5 -5 10 0 q5 -5 10 0" style="animation-delay:-.3s"/>
</g>
<g class="gull" fill="none" stroke="#3a3540" stroke-width="1.2" stroke-linecap="round" style="animation-delay:-7s;animation-duration:18s">
<path class="flap" d="M30 80 q4 -4 8 0 q4 -4 8 0"/>
</g>
<g fill="#e07a2c">
<path class="leaf" d="M240 0 q4 -4 8 0 q-4 4 -8 0z" style="animation-delay:-2s"/>
<path class="leaf" d="M290 0 q4 -4 8 0 q-4 4 -8 0z" fill="#c9562a" style="animation-delay:-6s"/>
<path class="leaf" d="M200 0 q4 -4 8 0 q-4 4 -8 0z" fill="#e8a040" style="animation-delay:-4s"/>
</g>
</svg>
